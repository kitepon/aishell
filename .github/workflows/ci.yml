name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full:
    uses: kitepon/dotagents/.github/workflows/factory-full-ci.yml@main
    with:
      environment: macos-native
      full-command: >-
        swift --version && xcodebuild -version && node --version && npm --version && rg --version && swift test && scripts/package-app.sh release && npm pack --dry-run
